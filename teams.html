<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teams & Rosters | Prior Lake Lakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050608;color:#fff;font-family:Inter,sans-serif;min-height:100vh}
:root{--navy:#07152f;--blue:#12366f;--gold:#f4c542;--muted:rgba(255,255,255,.58)}
nav{height:82px;padding:0 8%;display:flex;align-items:center;justify-content:space-between;background:rgba(3,7,15,.94);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:"Barlow Condensed";font-size:27px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--gold)}
nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}
nav a:hover{color:var(--gold)}
main{padding:100px 8%;max-width:1250px;margin:auto}
.label{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:15px}
h1{font-family:"Barlow Condensed";font-size:clamp(70px,10vw,125px);line-height:.8;text-transform:uppercase;letter-spacing:-2px}
h1 span{opacity:.25}
.subtitle{max-width:650px;margin-top:28px;color:var(--muted);line-height:1.8;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:65px}
.team{position:relative;padding:35px;min-height:210px;background:linear-gradient(145deg,#07152f,#0a1935);border:1px solid rgba(255,255,255,.08);text-decoration:none;color:#fff;transition:.4s;overflow:hidden}
.team:hover{transform:translateY(-7px);border-color:rgba(244,197,66,.5)}
.type{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:3px;margin-bottom:28px}
.team h2{font-family:"Barlow Condensed";font-size:45px;text-transform:uppercase;line-height:.9}
.team .arrow{position:absolute;right:25px;bottom:23px;color:var(--gold);font-size:24px}
.roster-view{display:none;margin-top:55px}
.roster-view.active{display:block}
.back{display:inline-block;color:var(--gold);text-decoration:none;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:25px}
.roster-head{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:25px}
.roster-head h2{font-family:"Barlow Condensed";font-size:70px;text-transform:uppercase;line-height:.85}
.roster-head p{color:var(--muted);font-size:12px}
.player-list{margin-top:25px}
.player{display:grid;grid-template-columns:80px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.number{font-family:"Barlow Condensed";font-size:35px;color:var(--gold);font-weight:900}
.name{font-family:"Barlow Condensed";font-size:30px;text-transform:uppercase}
.empty{padding:35px 0;color:var(--muted);line-height:1.7}
.loading{color:var(--muted);padding:30px 0}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:75px 6%}.roster-head{align-items:start;flex-direction:column}}
@media(max-width:550px){nav{height:70px;padding:0 6%}.grid{grid-template-columns:1fr}.team{min-height:190px}.roster-head h2{font-size:58px}.player{grid-template-columns:55px 1fr}.name{font-size:26px}}
</style>
</head>
<body>
<nav>
  <div class="logo">PRIOR LAKE <span>LAKERS</span></div>
  <a href="index.html">← Main Site</a>
</nav>

<main>
  <div id="teamDirectory">
    <div class="label">Teams & Rosters</div>
    <h1>THE<br><span>LAKERS.</span></h1>
    <p class="subtitle">Select a team to view the current roster. Rosters are updated by the Prior Lake Lakers coaching staff.</p>
    <div class="grid" id="teamGrid"></div>
  </div>

  <section class="roster-view" id="rosterView">
    <a class="back" href="teams.html">← All Teams</a>
    <div class="roster-head">
      <div>
        <div class="label" id="rosterType">BOYS</div>
        <h2 id="rosterTitle">Roster</h2>
      </div>
      <p id="rosterCount"></p>
    </div>
    <div id="playerList" class="player-list"><div class="loading">Loading roster...</div></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADTabbasMa1QKTKpnZq6_RCauvygUEgBU",
  authDomain: "prior-lake-aau.firebaseapp.com",
  projectId: "prior-lake-aau",
  storageBucket: "prior-lake-aau.firebasestorage.app",
  messagingSenderId: "379587730670",
  appId: "1:379587730670:web:b22e46d9c137524438a7ff"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const teams = [
  ["3-boys","BOYS","3rd Grade"],["4-boys","BOYS","4th Grade"],["5-boys","BOYS","5th Grade"],
  ["6-boys","BOYS","6th Grade"],["7-boys","BOYS","7th Grade"],["8-boys","BOYS","8th Grade"],
  ["9-boys","BOYS","9th Grade"],["10-boys","BOYS","10th Grade"],["11-boys","BOYS","11th Grade"],
  ["girls","GIRLS","Girls Teams"]
];

const grid = document.getElementById("teamGrid");
teams.forEach(([id,type,name]) => {
  const a = document.createElement("a");
  a.className = "team";
  a.href = `teams.html?team=${encodeURIComponent(id)}`;
  a.innerHTML = `<div class="type">${type}</div><h2>${name}</h2><div class="arrow">→</div>`;
  grid.appendChild(a);
});

const params = new URLSearchParams(location.search);
const teamId = params.get("team");

async function showRoster(id){
  const match = teams.find(t => t[0] === id);
  if(!match) return;

  document.getElementById("teamDirectory").style.display = "none";
  document.getElementById("rosterView").classList.add("active");
  document.getElementById("rosterType").textContent = match[1];
  document.getElementById("rosterTitle").textContent = match[2];

  try {
    const snap = await getDoc(doc(db,"teams",id));
    const list = document.getElementById("playerList");

    if(!snap.exists()){
      document.getElementById("rosterCount").textContent = "";
      list.innerHTML = `<div class="empty">The roster has not been posted yet. Please check back soon.</div>`;
      return;
    }

    const data = snap.data();
    const players = Array.isArray(data.players) ? data.players : [];
    document.getElementById("rosterCount").textContent = players.length ? `${players.length} PLAYER${players.length===1?"":"S"}` : "";

    if(!players.length){
      list.innerHTML = `<div class="empty">The roster has not been posted yet. Please check back soon.</div>`;
      return;
    }

    players.sort((a,b) => (Number(a.number)||999) - (Number(b.number)||999));
    list.innerHTML = players.map(p => `
      <div class="player">
        <div class="number">#${escapeHtml(p.number ?? "")}</div>
        <div class="name">${escapeHtml(p.name ?? "")}</div>
      </div>`).join("");
  } catch(err) {
    console.error(err);
    document.getElementById("playerList").innerHTML = `<div class="empty">We couldn't load this roster right now. Please try again.</div>`;
  }
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

if(teamId) showRoster(teamId);
</script>
</body>
</html>
