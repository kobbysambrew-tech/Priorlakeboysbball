<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Admin | Prior Lake Lakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050608;color:#fff;font-family:Inter,sans-serif;min-height:100vh}
:root{--navy:#07152f;--gold:#f4c542;--muted:rgba(255,255,255,.58)}
nav{height:82px;padding:0 8%;display:flex;align-items:center;justify-content:space-between;background:rgba(3,7,15,.94);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:"Barlow Condensed";font-size:27px;font-weight:900;letter-spacing:1px}.logo span{color:var(--gold)}
nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}
main{max-width:950px;margin:auto;padding:80px 6%}
.label{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:15px}
h1{font-family:"Barlow Condensed";font-size:75px;line-height:.85;text-transform:uppercase}
.panel{margin-top:40px;padding:35px;background:#07152f;border:1px solid rgba(255,255,255,.1)}
input,select{width:100%;padding:14px 15px;background:#050608;border:1px solid rgba(255,255,255,.15);color:#fff;font:inherit;outline:none}
input:focus,select:focus{border-color:rgba(244,197,66,.7)}
button{padding:13px 20px;border:1px solid var(--gold);background:var(--gold);color:#07152f;font-weight:900;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
button.secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
button.danger{background:transparent;color:#ff8e8e;border-color:rgba(255,100,100,.35)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.player-row{display:grid;grid-template-columns:100px 1fr auto;gap:12px;margin-top:12px}
.player-row button{padding:10px 14px}
.hidden{display:none!important}
.message{margin-top:15px;color:var(--muted);line-height:1.6}
.error{color:#ff9a9a}
.success{color:#a8e6a8}
.topline{display:flex;justify-content:space-between;align-items:center;gap:20px}
.small{font-size:12px;color:var(--muted)}
@media(max-width:600px){main{padding:55px 5%}h1{font-size:60px}.form-row{grid-template-columns:1fr}.player-row{grid-template-columns:70px 1fr}.player-row button{grid-column:1/-1}.topline{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<nav>
  <div class="logo">PRIOR LAKE <span>LAKERS</span></div>
  <a href="index.html">Main Site</a>
</nav>

<main>
  <div class="label">Coach Portal</div>
  <h1>ROSTER<br>ADMIN.</h1>

  <div id="loginPanel" class="panel">
    <div class="form-row">
      <div>
        <div class="label">Email</div>
        <input id="email" type="email" autocomplete="username" placeholder="Coach email">
      </div>
      <div>
        <div class="label">Password</div>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      </div>
    </div>
    <div class="actions"><button id="loginBtn">Log In</button></div>
    <div id="loginMessage" class="message"></div>
  </div>

  <div id="adminPanel" class="panel hidden">
    <div class="topline">
      <div>
        <div class="label">Manage Rosters</div>
        <div class="small" id="signedInAs"></div>
      </div>
      <button class="secondary" id="logoutBtn">Log Out</button>
    </div>

    <div style="margin-top:30px">
      <div class="label">Select Team</div>
      <select id="teamSelect"></select>
    </div>

    <div id="players"></div>

    <div class="actions">
      <button id="addBtn">+ Add Player</button>
      <button id="saveBtn">Save Roster</button>
    </div>
    <div id="saveMessage" class="message"></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADTabbasMa1QKTKpnZq6_RCauvygUEgBU",
  authDomain: "prior-lake-aau.firebaseapp.com",
  projectId: "prior-lake-aau",
  storageBucket: "prior-lake-aau.firebasestorage.app",
  messagingSenderId: "379587730670",
  appId: "1:379587730670:web:b22e46d9c137524438a7ff"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const teams = [
  ["3-boys","BOYS","3rd Grade"],["4-boys","BOYS","4th Grade"],["5-boys","BOYS","5th Grade"],
  ["6-boys","BOYS","6th Grade"],["7-boys","BOYS","7th Grade"],["8-boys","BOYS","8th Grade"],
  ["9-boys","BOYS","9th Grade"],["10-boys","BOYS","10th Grade"],["11-boys","BOYS","11th Grade"],
  ["girls","GIRLS","Girls Teams"]
];

const teamSelect = document.getElementById("teamSelect");
teams.forEach(([id,type,name]) => {
  const opt=document.createElement("option");
  opt.value=id; opt.textContent=`${type} — ${name}`;
  teamSelect.appendChild(opt);
});

let currentPlayers=[];

function renderPlayers(){
  const box=document.getElementById("players");
  box.innerHTML="";
  if(!currentPlayers.length){
    box.innerHTML='<div class="message">No players yet. Click “Add Player” to begin.</div>';
    return;
  }
  currentPlayers.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="player-row";
    row.innerHTML=`
      <input class="number-input" type="number" min="0" max="99" value="${escAttr(p.number ?? "")}" placeholder="#">
      <input class="name-input" type="text" value="${escAttr(p.name ?? "")}" placeholder="Player name">
      <button class="danger remove-btn" type="button">Remove</button>`;
    row.querySelector(".number-input").addEventListener("input",e=>currentPlayers[i].number=e.target.value);
    row.querySelector(".name-input").addEventListener("input",e=>currentPlayers[i].name=e.target.value);
    row.querySelector(".remove-btn").addEventListener("click",()=>{currentPlayers.splice(i,1);renderPlayers()});
    box.appendChild(row);
  });
}

async function loadTeam(){
  document.getElementById("saveMessage").textContent="Loading roster...";
  try{
    const snap=await getDoc(doc(db,"teams",teamSelect.value));
    currentPlayers=snap.exists() && Array.isArray(snap.data().players) ? snap.data().players : [];
    renderPlayers();
    document.getElementById("saveMessage").textContent="";
  }catch(err){
    console.error(err);
    document.getElementById("saveMessage").textContent="Couldn't load this roster.";
    document.getElementById("saveMessage").className="message error";
  }
}

document.getElementById("addBtn").addEventListener("click",()=>{
  currentPlayers.push({name:"",number:""});
  renderPlayers();
});

document.getElementById("saveBtn").addEventListener("click",async()=>{
  const clean=currentPlayers
    .map(p=>({name:String(p.name||"").trim(),number:String(p.number??"").trim()}))
    .filter(p=>p.name);
  currentPlayers=clean;
  try{
    await setDoc(doc(db,"teams",teamSelect.value),{
      players:clean,
      updatedAt:Date.now()
    });
    document.getElementById("saveMessage").textContent="Roster saved successfully.";
    document.getElementById("saveMessage").className="message success";
    renderPlayers();
  }catch(err){
    console.error(err);
    document.getElementById("saveMessage").textContent="Couldn't save. Check your Firebase Firestore rules.";
    document.getElementById("saveMessage").className="message error";
  }
});

teamSelect.addEventListener("change",loadTeam);

document.getElementById("loginBtn").addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("loginMessage");
  try{
    await signInWithEmailAndPassword(auth,email,password);
    msg.textContent="";
  }catch(err){
    msg.textContent="Login failed. Check the email and password.";
    msg.className="message error";
  }
});

document.getElementById("logoutBtn").addEventListener("click",()=>signOut(auth));

onAuthStateChanged(auth,user=>{
  const login=document.getElementById("loginPanel");
  const admin=document.getElementById("adminPanel");
  if(user){
    login.classList.add("hidden");
    admin.classList.remove("hidden");
    document.getElementById("signedInAs").textContent=`Signed in as ${user.email}`;
    loadTeam();
  }else{
    login.classList.remove("hidden");
    admin.classList.add("hidden");
  }
});

function escAttr(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
</body>
</html>
