<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Admin | Prior Lake Lakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03050a;color:#fff;font-family:Inter,sans-serif;min-height:100vh}
:root{--navy:#07152f;--navy2:#0a1935;--gold:#f4c542;--muted:rgba(255,255,255,.58);--line:rgba(255,255,255,.09)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 10%,rgba(244,197,66,.08),transparent 28%),radial-gradient(circle at 10% 90%,rgba(18,54,111,.18),transparent 35%);z-index:-1}
nav{height:78px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:rgba(3,7,15,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.logo{font-family:"Barlow Condensed";font-size:27px;font-weight:900;letter-spacing:1px}.logo span{color:var(--gold)}
nav a{color:#fff;text-decoration:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;border:1px solid rgba(255,255,255,.15);padding:10px 16px;transition:.3s}
nav a:hover{border-color:var(--gold);color:var(--gold)}
main{max-width:1120px;margin:auto;padding:65px 6% 90px}
.label{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:13px;font-weight:800}
h1{font-family:"Barlow Condensed";font-size:clamp(70px,9vw,120px);line-height:.78;text-transform:uppercase;letter-spacing:-2px}
.panel{margin-top:35px;padding:32px;background:linear-gradient(145deg,rgba(7,21,47,.96),rgba(6,12,24,.96));border:1px solid var(--line);box-shadow:0 25px 70px rgba(0,0,0,.25);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
input,select{width:100%;padding:15px 16px;background:#03060d;border:1px solid rgba(255,255,255,.13);border-radius:2px;color:#fff;font:inherit;outline:none;transition:.25s}
input:focus,select:focus{border-color:rgba(244,197,66,.7);box-shadow:0 0 0 3px rgba(244,197,66,.06)}
button{padding:13px 20px;border:1px solid var(--gold);background:var(--gold);color:#07152f;font-weight:900;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:.25s}
button:hover{transform:translateY(-2px);filter:brightness(1.05)}
button.secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.2)}
button.danger{background:transparent;color:#ff9a9a;border-color:rgba(255,100,100,.3)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.message{margin-top:15px;color:var(--muted);line-height:1.6;font-size:13px}
.error{color:#ff9a9a}.success{color:#a8e6a8}
.topline{display:flex;justify-content:space-between;align-items:center;gap:20px}
.small{font-size:12px;color:var(--muted)}
#teamSelect{margin-top:2px;font-weight:700}
#players{margin-top:20px}
.player-row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);margin-top:10px}
.player-row input{background:#050910}
.hidden{display:none!important}
.admin-title{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(244,197,66,.25);padding:9px 12px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.section-divider{height:1px;background:var(--line);margin:28px 0}
@media(max-width:700px){main{padding:50px 5%}.form-row{grid-template-columns:1fr}.admin-title{align-items:flex-start;flex-direction:column}.player-row{grid-template-columns:70px 1fr}.player-row button{grid-column:1/-1}.topline{align-items:flex-start;flex-direction:column}nav{padding:0 5%}}
</style>
</head>
<body>
<nav>
  <div class="logo">PRIOR LAKE <span>LAKERS</span></div>
  <a href="index.html">Main Site</a>
</nav>

<main>
  <div class="admin-title"><div><div class="label">Coach Portal</div><h1>ROSTER<br>ADMIN.</h1></div><div class="badge">Secure Coach Access</div></div>

  <div id="loginPanel" class="panel">
    <div class="form-row">
      <div>
        <div class="label">Email</div>
        <input id="email" type="email" autocomplete="username" placeholder="Coach email">
      </div>
      <div>
        <div class="label">Password</div>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      </div>
    </div>
    <div class="actions"><button id="loginBtn">Log In</button></div>
    <div id="loginMessage" class="message"></div>
  </div>

  <div id="adminPanel" class="panel hidden">
    <div class="topline">
      <div>
        <div class="label">Manage Rosters</div>
        <div class="small">Update players and jersey numbers. Changes go live after saving.</div>
        <div class="small" id="signedInAs" style="margin-top:7px"></div>
      </div>
      <button class="secondary" id="logoutBtn">Log Out</button>
    </div>

    <div style="margin-top:30px">
      <div class="label">Select Team</div>
      <select id="teamSelect"></select>
    </div>
    <div class="section-divider"></div>
    <div class="label">Players</div>
    <div id="players"></div>

    <div class="actions">
      <button id="addBtn">+ Add Player</button>
      <button id="saveBtn">Save Roster</button>
    </div>
    <div id="saveMessage" class="message"></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADTabbasMa1QKTKpnZq6_RCauvygUEgBU",
  authDomain: "prior-lake-aau.firebaseapp.com",
  projectId: "prior-lake-aau",
  storageBucket: "prior-lake-aau.firebasestorage.app",
  messagingSenderId: "379587730670",
  appId: "1:379587730670:web:b22e46d9c137524438a7ff"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const teams = [
  ["3-boys","BOYS","3rd Grade"],["4-boys","BOYS","4th Grade"],["5-boys","BOYS","5th Grade"],
  ["6-boys","BOYS","6th Grade"],["7-boys","BOYS","7th Grade"],["8-boys","BOYS","8th Grade"],
  ["9-boys","BOYS","9th Grade"],["10-boys","BOYS","10th Grade"],["11-boys","BOYS","11th Grade"],
  ["girls","GIRLS","Girls Teams"]
];

const teamSelect = document.getElementById("teamSelect");
teams.forEach(([id,type,name]) => {
  const opt=document.createElement("option");
  opt.value=id; opt.textContent=`${type} — ${name}`;
  teamSelect.appendChild(opt);
});

let currentPlayers=[];

function renderPlayers(){
  const box=document.getElementById("players");
  box.innerHTML="";
  if(!currentPlayers.length){
    box.innerHTML='<div class="message">No players yet. Click “Add Player” to begin.</div>';
    return;
  }
  currentPlayers.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="player-row";
    row.innerHTML=`
      <input class="number-input" type="number" min="0" max="99" value="${escAttr(p.number ?? "")}" placeholder="#">
      <input class="name-input" type="text" value="${escAttr(p.name ?? "")}" placeholder="Player name">
      <button class="danger remove-btn" type="button">Remove</button>`;
    row.querySelector(".number-input").addEventListener("input",e=>currentPlayers[i].number=e.target.value);
    row.querySelector(".name-input").addEventListener("input",e=>currentPlayers[i].name=e.target.value);
    row.querySelector(".remove-btn").addEventListener("click",()=>{currentPlayers.splice(i,1);renderPlayers()});
    box.appendChild(row);
  });
}

async function loadTeam(){
  document.getElementById("saveMessage").textContent="Loading roster...";
  try{
    const snap=await getDoc(doc(db,"teams",teamSelect.value));
    currentPlayers=snap.exists() && Array.isArray(snap.data().players) ? snap.data().players : [];
    renderPlayers();
    document.getElementById("saveMessage").textContent="";
  }catch(err){
    console.error(err);
    document.getElementById("saveMessage").textContent="Couldn't load this roster.";
    document.getElementById("saveMessage").className="message error";
  }
}

document.getElementById("addBtn").addEventListener("click",()=>{
  currentPlayers.push({name:"",number:""});
  renderPlayers();
});

document.getElementById("saveBtn").addEventListener("click",async()=>{
  const clean=currentPlayers
    .map(p=>({name:String(p.name||"").trim(),number:String(p.number??"").trim()}))
    .filter(p=>p.name);
  currentPlayers=clean;
  try{
    await setDoc(doc(db,"teams",teamSelect.value),{
      players:clean,
      updatedAt:Date.now()
    });
    document.getElementById("saveMessage").textContent="Roster saved successfully.";
    document.getElementById("saveMessage").className="message success";
    renderPlayers();
  }catch(err){
    console.error(err);
    document.getElementById("saveMessage").textContent="Couldn't save. Check your Firebase Firestore rules.";
    document.getElementById("saveMessage").className="message error";
  }
});

teamSelect.addEventListener("change",loadTeam);

document.getElementById("loginBtn").addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("loginMessage");
  try{
    await signInWithEmailAndPassword(auth,email,password);
    msg.textContent="";
  }catch(err){
    msg.textContent="Login failed. Check the email and password.";
    msg.className="message error";
  }
});

document.getElementById("logoutBtn").addEventListener("click",()=>signOut(auth));

onAuthStateChanged(auth,user=>{
  const login=document.getElementById("loginPanel");
  const admin=document.getElementById("adminPanel");
  if(user){
    login.classList.add("hidden");
    admin.classList.remove("hidden");
    document.getElementById("signedInAs").textContent=`Signed in as ${user.email}`;
    loadTeam();
  }else{
    login.classList.remove("hidden");
    admin.classList.add("hidden");
  }
});

function escAttr(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
</body>
</html>
